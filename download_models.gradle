import de.undercouch.gradle.tasks.download.Download

def models = [
        'mobilenet_v3_large.tflite': 'https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_large/float16/1/mobilenet_v3_large.tflite',
        'mobilenet_v3_small.tflite': 'https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_small/float16/1/mobilenet_v3_small.tflite'
]

def modelDir = project.ext.ASSET_DIR

tasks.register('downloadModels') {
    doLast {
        modelDir.mkdirs()
        models.each { modelName, modelLink ->
            def modelFile = new File(modelDir, modelName)
            if (!modelFile.exists()) {
                println "Downloading model ${modelName}..."
                def downloadTask = project.tasks.create("download_${modelName}", Download)
                downloadTask.src(modelLink)
                downloadTask.dest(modelFile)
                downloadTask.execute()
                println "Model ${modelName} downloaded."
            }
        }
    }
}

tasks.whenTaskAdded { task ->
    if (task.name == 'preBuild') {
        task.dependsOn(downloadModels)
    }
}
