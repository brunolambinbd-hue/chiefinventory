# Project-wide Gradle settings.
# For more details on how to configure your build environment visit
# https://www.gradle.org/docs/current/userguide/build_environment.html

# The Gradle Daemon allows Gradle to run in the background and speed up your builds.
org.gradle.daemon=true

# The Kotlin compiler daemon can also run in the background.
kotlin.daemon.use-jps=true

# Enable the configuration cache to speed up builds.
org.gradle.configuration-cache=true

# AndroidX properties
android.useAndroidX=true
android.enableJetifier=true
